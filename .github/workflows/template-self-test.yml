name: CP5 Assessment Self-Test

on:
  push:
    branches: [main]
    paths: ['README.md','.github/**']
  pull_request:
    branches: [main]
    paths: ['README.md','.github/**']

permissions:
  contents: read

jobs:
  structural-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate CP5 from-scratch portal
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            README.md \
            .github/ISSUE_TEMPLATE/cp5-submission.yml \
            .github/workflows/grade-external-submission.yml \
            .github/workflows/publish-grade.yml \
            .github/workflows/student-score-reusable.yml \
            .github/examples/cp5-student-score.yml; do
            test -f "$f" || { echo "Missing $f"; exit 1; }
          done

          grep -q 'do NOT copy this repository' README.md
          grep -q 'GitHub → New repository' README.md
          grep -q 'cp5-final-integrated-YOUR-GITHUB-USERNAME' README.md
          grep -q 'cp5-YOUR-GITHUB-USERNAME' README.md
          grep -q 'Submit CP5' README.md
          grep -q 'CP5 Published Grade' README.md
          grep -q 'Final score' README.md
          grep -q 'student-score-reusable.yml@main' README.md
          grep -q 'Practice Repository URL' .github/ISSUE_TEMPLATE/cp5-submission.yml
          grep -q 'Debugging Scenario A' .github/ISSUE_TEMPLATE/cp5-submission.yml
          grep -q 'Debugging Scenario D' .github/ISSUE_TEMPLATE/cp5-submission.yml
          grep -q 'created the CP5 repository myself' .github/ISSUE_TEMPLATE/cp5-submission.yml
          grep -q '/manual-grade' .github/workflows/grade-external-submission.yml
          grep -q 'Workflow independence: 0/10' .github/workflows/grade-external-submission.yml
          grep -q 'Project evidence: 0/5' .github/workflows/grade-external-submission.yml
          grep -q 'Concepts: 0/10' .github/workflows/grade-external-submission.yml
          grep -q 'Debugging: 0/10' .github/workflows/grade-external-submission.yml
          grep -q 'Reflection: 0/5' .github/workflows/grade-external-submission.yml
          grep -q '.cp5-grades/' .github/workflows/publish-grade.yml
          grep -q 'FINAL SCORE' .github/workflows/publish-grade.yml
          grep -q 'klis-cp5-local-score' .github/workflows/student-score-reusable.yml
          echo 'CP5 from-scratch assessment portal is valid.'

      - name: Validate workflow YAML syntax
        shell: bash
        run: |
          ruby -e "require 'yaml'; Dir['.github/workflows/*.yml'].each { |f| YAML.load_file(f); puts \"OK #{f}\" }"
