name: Checkpoint 5 — Auto and Teacher Grade

on:
  push:
    branches: ['cp5-*']
  pull_request_target:
    types: [opened, reopened, synchronize, edited, closed]
    branches: [main]
  issues:
    types: [opened, edited, labeled, unlabeled, assigned, unassigned, closed, reopened]
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  grade:
    if: ${{ github.event_name != 'issue_comment' || github.event.issue.pull_request }}
    runs-on: ubuntu-latest
    steps:
      - name: Grade checkpoint
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const marker = '<!-- klis-cp5-progress -->';
            const allowedGraders = new Set(['hbycwyh2008']);

            let eventPR = null;
            if (context.eventName === 'pull_request_target') eventPR = context.payload.pull_request;
            if (context.eventName === 'issue_comment') {
              eventPR = (await github.rest.pulls.get({owner, repo, pull_number:context.payload.issue.number})).data;
            }

            const username = eventPR ? eventPR.user.login :
              context.eventName === 'issues' ? context.payload.issue.user.login : context.actor;
            const branch = `cp5-${username}`;

            let branchExists = false;
            try { await github.rest.repos.getBranch({owner, repo, branch}); branchExists = true; }
            catch (e) { if (e.status !== 404) throw e; }

            let aheadBy = 0;
            if (branchExists) {
              try {
                const cmp = await github.rest.repos.compareCommitsWithBasehead({owner, repo, basehead:`main...${branch}`});
                aheadBy = cmp.data.ahead_by || 0;
              } catch (e) { core.warning(e.message); }
            }

            const read = async path => {
              if (!branchExists) return '';
              try {
                const r = await github.rest.repos.getContent({owner, repo, path, ref:branch});
                if (Array.isArray(r.data) || !r.data.content) return '';
                return Buffer.from(r.data.content, r.data.encoding).toString('utf8');
              } catch (e) { if (e.status === 404) return ''; throw e; }
            };

            const paths = ['final-project/README.md','final-project/.gitignore','final-project/LICENSE','final-project/src/index.js'];
            const contents = [];
            for (const p of paths) contents.push(await read(p));
            const fileScore = [2,2,2,4].reduce((sum,pts,i)=>sum+(contents[i] ? pts : 0),0);

            const submission = await read('submission.md');
            const field = label => submission.match(new RegExp(`^${label}:\\s*(\\S.*)$`, 'mi'))?.[1]?.trim() || '';
            const answer = heading => submission.match(new RegExp(`## ${heading}[\\s\\S]*?\\nAnswer:\\s*([\\s\\S]*?)(?=\\n## |$)`, 'i'))?.[1]?.trim() || '';
            const submissionComplete = ['Name','GitHub Username','Required Branch','Issue Number','Project URL','Project Statuses Used','Pull Request Number'].every(field) &&
              ['Question 1','Question 2','Question 3','Question 4','Question 5','Debugging Scenario A','Debugging Scenario B','Debugging Scenario C','Debugging Scenario D','Reflection'].every(answer);

            const allIssues = await github.paginate(github.rest.issues.listForRepo, {owner, repo, state:'all', per_page:100});
            const cpIssue = allIssues.find(i => !i.pull_request && /^\[CP5\]/i.test(i.title) && i.user?.login?.toLowerCase() === username.toLowerCase());
            const issueBody = cpIssue?.body || '';
            const checklist = (issueBody.match(/- \[ \]/g) || []).length + (issueBody.match(/- \[[xX]\]/g) || []).length;
            const hasLabel = Boolean(cpIssue?.labels?.length);
            const assigned = Boolean(cpIssue?.assignees?.some(a => a.login.toLowerCase() === username.toLowerCase()));
            let issueScore = 0;
            if (cpIssue) issueScore += 2;
            if (checklist >= 2) issueScore += 2;
            if (hasLabel) issueScore += 3;
            if (assigned) issueScore += 3;

            const pulls = await github.paginate(github.rest.pulls.list, {owner, repo, state:'all', per_page:100});
            const pr = pulls.find(p => p.head.ref === branch && p.base.ref === 'main' && p.user.login.toLowerCase() === username.toLowerCase() && p.state === 'open');
            const closesIssue = Boolean(cpIssue && pr && new RegExp(`\\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\\s+#${cpIssue.number}\\b`, 'i').test(pr.body || ''));

            const checks = [
              ['Correct checkpoint branch', branchExists ? 5 : 0, 5, branchExists ? branch : `expected ${branch}`],
              ['Required final-project files exist', fileScore, 10, `${contents.filter(Boolean).length}/4 files found`],
              ['[CP5] Issue has checklist, label, and assignee', issueScore, 10, cpIssue ? `Issue #${cpIssue.number}; checklist ${checklist}` : 'create required Issue'],
              ['At least one commit ahead of main', aheadBy > 0 ? 5 : 0, 5, aheadBy > 0 ? `${aheadBy} commit(s)` : 'no commit detected'],
              ['Pull Request targets main', pr ? 10 : 0, 10, pr ? `PR #${pr.number}` : 'open required PR'],
              ['PR closes/references CP5 Issue', closesIssue ? 10 : 0, 10, closesIssue ? `closing reference to #${cpIssue.number}` : 'use Closes #N / Fixes #N / Resolves #N'],
              ['Submission complete', submissionComplete ? 10 : 0, 10, submissionComplete ? 'all fields and debugging responses completed' : 'complete submission.md']
            ];

            const automatic = checks.reduce((s,c) => s + c[1], 0);
            let manual = null;
            if (pr) {
              const comments = await github.paginate(github.rest.issues.listComments, {owner, repo, issue_number:pr.number, per_page:100});
              for (const c of [...comments].sort((a,b)=>new Date(b.updated_at)-new Date(a.updated_at))) {
                if (!allowedGraders.has(c.user?.login?.toLowerCase())) continue;
                const m = c.body?.match(/(?:^|\n)\s*\/manual-grade\s+(40|[0-3]?\d)(?:\s|$)/i);
                if (m) { manual = {score:Number(m[1]), grader:c.user.login}; break; }
              }
            }

            const teacher = manual?.score ?? 0;
            const total = automatic + teacher;
            const rows = checks.map(([label,earned,max,detail]) => `| ${earned===max?'✅':earned?'🟨':'⬜'} ${label} | ${earned}/${max} | ${detail} |`).join('\n');
            const status = automatic < 60 ? '🟡 **IN PROGRESS**' : !manual ? '🔵 **AWAITING TEACHER REVIEW**' : `✅ **FINAL SCORE: ${total}/100**`;
            const progressBody = `${marker}\n## Checkpoint 5 Progress\n\n**Automatic:** ${automatic}/60  \n**Teacher:** ${manual ? `${teacher}/40` : 'awaiting review'}  \n**Current total:** ${total}/100\n\n| Check | Score | Evidence |\n|---|---:|---|\n${rows}\n| 🧑‍🏫 Teacher review | ${manual ? `${teacher}/40` : '—/40'} | ${manual ? `graded by @${manual.grader}` : 'awaiting review'} |\n\n${status}\n\n> GitHub Project evidence and debugging quality are teacher-reviewed.`;

            let progress = allIssues.find(i => !i.pull_request && i.body?.includes(marker));
            if (!progress) progress = (await github.rest.issues.create({owner, repo, title:'Checkpoint 5 — Progress', body:marker})).data;
            const comments = await github.paginate(github.rest.issues.listComments, {owner, repo, issue_number:progress.number, per_page:100});
            const old = comments.find(c => c.user?.type === 'Bot' && c.body?.includes(marker));
            if (old) await github.rest.issues.updateComment({owner, repo, comment_id:old.id, body:progressBody});
            else await github.rest.issues.createComment({owner, repo, issue_number:progress.number, body:progressBody});

            await core.summary.addHeading(`Checkpoint 5: ${total}/100`).addRaw(`Automatic: ${automatic}/60\n`).addRaw(`Teacher: ${manual ? `${teacher}/40` : 'awaiting review'}\n`).write();
            if (automatic !== 60 && ['push','pull_request_target'].includes(context.eventName)) core.setFailed(`Automatic score is ${automatic}/60.`);
